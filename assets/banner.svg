<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">European Energy Analytics</title>
  <desc id="desc">Mapping Europe's energy transition with official Eurostat data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d27"/><stop offset="1" stop-color="#1d5445"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#96e6bc"/><stop offset="1" stop-color="#40ac87"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b5eed3" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1100" cy="20" r="270" fill="#9be7c3" opacity=".035"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="78" fill="#9de1be" font-size="13" font-weight="700" letter-spacing="3">EUROPEAN ENERGY TRANSITION</text>
    <text x="60" y="142" fill="#f5fff9" font-size="47" font-weight="700" letter-spacing="-1.5">European Energy</text>
    <text x="60" y="196" fill="#f5fff9" font-size="47" font-weight="700" letter-spacing="-1.5">Analytics</text>
    <text x="64" y="231" fill="#c0d8ce" font-size="18">Mapping Europe's energy transition with official data.</text>
    <g font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">
      <rect x="64" y="267" width="108" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8ac9ac" stroke-opacity=".3"/>
      <text x="118" y="289" fill="#d9f4e5">EUROSTAT</text>
      <path d="M184 284h25m-6-5 6 5-6 5" fill="none" stroke="#8ac9ac" stroke-width="1.5"/>
      <rect x="222" y="267" width="100" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#8ac9ac" stroke-opacity=".3"/>
      <text x="272" y="289" fill="#d9f4e5">ENERGY</text>
      <path d="M334 284h25m-6-5 6 5-6 5" fill="none" stroke="#8ac9ac" stroke-width="1.5"/>
      <rect x="372" y="267" width="116" height="34" rx="17" fill="#9de1be"/>
      <text x="430" y="289" fill="#143c30">INSIGHTS</text>
    </g>
    <rect x="680" y="55" width="450" height="250" rx="16" fill="#102d27" stroke="#75c7a0" stroke-opacity=".28"/>
    <circle cx="704" cy="78" r="3" fill="#93dcb7"/><circle cx="717" cy="78" r="3" fill="#93dcb7" opacity=".5"/><circle cx="730" cy="78" r="3" fill="#93dcb7" opacity=".25"/>
    <text x="1098" y="83" fill="#91bba8" font-size="10" text-anchor="end" letter-spacing="2">EUROPE / ENERGY / 1990–2024</text>
    <path d="M711 127h390M711 171h390M711 215h390M711 259h390" stroke="#94c5ae" stroke-opacity=".12"/>
    <g fill="url(#bar)">
      <rect x="746" y="224" width="48" height="35" rx="5"/>
      <rect x="828" y="204" width="48" height="55" rx="5"/>
      <rect x="910" y="174" width="48" height="85" rx="5"/>
      <rect x="992" y="139" width="48" height="120" rx="5"/>
    </g>
    <path d="m770 214 82-20 82-35 82-29" fill="none" stroke="#d8f7e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#d8f7e5"><circle cx="770" cy="214" r="4"/><circle cx="852" cy="194" r="4"/><circle cx="934" cy="159" r="4"/><circle cx="1016" cy="130" r="4"/></g>
    <text x="770" y="283" fill="#91bba8" font-size="9" text-anchor="middle">1990</text>
    <text x="852" y="283" fill="#91bba8" font-size="9" text-anchor="middle">2000</text>
    <text x="934" y="283" fill="#91bba8" font-size="9" text-anchor="middle">2010</text>
    <text x="1016" y="283" fill="#91bba8" font-size="9" text-anchor="middle">2024</text>
